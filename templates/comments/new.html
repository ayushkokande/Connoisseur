{{define "content"}}
{{$restaurant := .Data.Restaurant}}
<div class="container">
	<div class="row justify-content-center">
		<div class="col-md-6">
			<h1 class="text-center my-4">Review {{$restaurant.Name}}</h1>
			<form action="/restaurants/{{$restaurant.ID.Hex}}/comments" method="POST">
				{{$.CSRFField}}
				<div class="form-group">
					<label for="rating">Your Rating</label>
					<select class="form-control" id="rating" name="rating" required>
						<option value="" disabled selected>Choose a rating</option>
						{{range .Data.RatingChoices}}
							<option value="{{.}}">{{stars .}} &mdash; {{.}} out of 5</option>
						{{end}}
					</select>
				</div>
				<div class="form-group">
					<label for="text">Your Review</label>
					<textarea class="form-control" id="text" name="text" rows="4" placeholder="How was your experience?" required></textarea>
				</div>
				<button class="btn btn-success btn-block" type="submit">Submit Review</button>
			</form>
			<a href="/restaurants/{{$restaurant.ID.Hex}}" class="d-block text-center mt-3">Go Back</a>
		</div>
	</div>
</div>
{{end}}
