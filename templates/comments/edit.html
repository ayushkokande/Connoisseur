{{define "content"}}
{{$restaurantID := .Data.RestaurantID}}
{{$comment := .Data.Comment}}
<div class="container">
	<div class="row justify-content-center">
		<div class="col-md-6">
			<h1 class="text-center my-4">Edit Your Review</h1>
			<form action="/restaurants/{{$restaurantID}}/comments/{{$comment.ID.Hex}}?_method=PUT" method="POST">
				<div class="form-group">
					<label for="text">Your Review</label>
					<textarea class="form-control" id="text" name="text" rows="4" required>{{$comment.Text}}</textarea>
				</div>
				<button class="btn btn-success btn-block" type="submit">Update Review</button>
			</form>
			<a href="/restaurants/{{$restaurantID}}" class="d-block text-center mt-3">Go Back</a>
		</div>
	</div>
</div>
{{end}}
