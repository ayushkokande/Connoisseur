{{define "content"}}
<div class="container">
	<div class="row justify-content-center">
		<div class="col-md-5">
			<h1 class="text-center my-4">Sign Up for Connoisseur</h1>
			<form action="/register" method="POST">
				{{$.CSRFField}}
				<div class="form-group">
					<label for="username">Username</label>
					<input class="form-control" id="username" type="text" name="username" placeholder="Choose a username" required>
				</div>
				<div class="form-group">
					<label for="password">Password</label>
					<input class="form-control" id="password" type="password" name="password" placeholder="Choose a password" required>
				</div>
				<button class="btn btn-primary btn-block" type="submit">Sign Up</button>
			</form>
			<p class="text-center mt-3">Already have an account? <a href="/login">Log in</a></p>
		</div>
	</div>
</div>
{{end}}
