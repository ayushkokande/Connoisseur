{{define "content"}}
<div class="container">
	<div class="row justify-content-center">
		<div class="col-md-5">
			<div class="card mt-5">
				<div class="card-body text-center">
					<h4 class="card-title mb-3">Sign in</h4>
					<p class="card-text text-muted mb-4">
						Connoisseur uses your Google account, so there is no password here to
						forget or to lose.
					</p>
					<a class="btn btn-primary btn-block" href="/auth/start">Continue with Google</a>
					<p class="text-muted mt-4 mb-0"><small>
						First time? You will be asked to pick a username after signing in.
					</small></p>
				</div>
			</div>
		</div>
	</div>
</div>
{{end}}
