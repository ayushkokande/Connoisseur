{{define "content"}}
<div class="container">
	<div class="row justify-content-center">
		<div class="col-md-5">
			<div class="card mt-5">
				<div class="card-body">
					<h4 class="card-title mb-1">Pick a username</h4>
					<p class="text-muted">
						{{with .Data.Email}}Signed in as {{.}}. {{end}}This is the name shown
						against your restaurants and reviews.
					</p>
					<form action="/signup" method="POST">
						{{.CSRFField}}
						<div class="form-group">
							<label for="username">Username</label>
							<input class="form-control" type="text" id="username" name="username"
								autocomplete="username" autofocus required
								minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+">
							<small class="form-text text-muted">
								3 to 30 characters. Letters, numbers and underscores only.
							</small>
						</div>
						<button class="btn btn-primary btn-block" type="submit">Create my account</button>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>
{{end}}
