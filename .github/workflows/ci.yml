name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: mongodb://localhost:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - run: go vet ./...

      - run: go build ./...

      # The web package's integration tests silently skip without a database,
      # so failing here means the service container never came up.
      - run: go test -race ./...

  docker:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: connoisseur:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker network create connoisseur-ci
          docker run -d --name mongo --network connoisseur-ci mongo:8
          docker run -d --name app --network connoisseur-ci -p 3000:3000 \
            -e DATABASE_URL=mongodb://mongo:27017 connoisseur:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done

          echo "app never became healthy"
          docker logs app
          exit 1
